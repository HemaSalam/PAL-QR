<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Name Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --border: #e2e2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --card-bg: #212126;
      --text: #f2f2f2;
      --muted: #9a9aa2;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --border: #333338;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a;
    --card-bg: #212126;
    --text: #f2f2f2;
    --muted: #9a9aa2;
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --border: #333338;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 1rem;
    resize: vertical;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
    align-items: center;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  label { font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=number] {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 28px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .card .qr {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
  }
  .card .qr img, .card .qr canvas { max-width: 100%; height: auto; }
  .card .number { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
  .card .name { font-weight: 600; word-break: break-word; }
  .empty { color: var(--muted); margin-top: 24px; font-size: 0.9rem; }

  @media print {
    body { background: #ffffff; padding: 0; }
    .controls, textarea, h1, p.sub, #emptyMsg { display: none !important; }
    #grid { display: block; margin-top: 0; }
    .card {
      background: #ffffff;
      border: none;
      page-break-after: always;
      break-after: page;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card:last-child { page-break-after: auto; break-after: auto; }
    .card .qr img, .card .qr canvas { width: 260px; height: 260px; }
    .card .name { font-size: 1.4rem; margin-top: 12px; }
    .card .number { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Name Generator</h1>
  <p class="sub">Enter one name per line. Each gets a QR code encoding a number, counting up starting from 1.</p>

  <textarea id="namesInput" placeholder="Alice&#10;Bob&#10;Charlie&#10;Dana"></textarea>

  <div class="controls">
    <button id="generateBtn">Generate</button>
    <button id="printBtn" class="secondary">Print / Save as PDF</button>
    <button id="clearBtn" class="secondary">Clear</button>
    <label>Start number
      <input type="number" id="startNum" placeholder="1" min="1" style="width:90px">
    </label>
    <label>QR encodes
      <select id="encodeMode">
        <option value="number">Just the number</option>
        <option value="nameNumber">Name + number</option>
      </select>
    </label>
  </div>

  <div id="grid"></div>
  <div id="emptyMsg" class="empty">No names yet — type some above and hit Generate.</div>
</div>

<script>
const namesInput = document.getElementById('namesInput');
const generateBtn = document.getElementById('generateBtn');
const clearBtn = document.getElementById('clearBtn');
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('emptyMsg');
const startNumInput = document.getElementById('startNum');
const encodeMode = document.getElementById('encodeMode');
const printBtn = document.getElementById('printBtn');

function generate() {
  const lines = namesInput.value
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);

  grid.innerHTML = '';

  if (lines.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  const start = parseInt(startNumInput.value, 10) || 1;

  lines.forEach((name, i) => {
    const num = start + i; // ascending
    const card = document.createElement('div');
    card.className = 'card';

    const qrDiv = document.createElement('div');
    qrDiv.className = 'qr';
    card.appendChild(qrDiv);

    const numberEl = document.createElement('div');
    numberEl.className = 'number';
    numberEl.textContent = '#' + num;
    card.appendChild(numberEl);

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = name;
    card.appendChild(nameEl);

    grid.appendChild(card);

    const text = encodeMode.value === 'nameNumber' ? (num + ' - ' + name) : String(num);

    try {
      new QRCode(qrDiv, {
        text: text,
        width: 140,
        height: 140,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      qrDiv.textContent = 'QR error';
    }
  });
}

generateBtn.addEventListener('click', generate);
printBtn.addEventListener('click', () => {
  if (grid.children.length === 0) {
    alert('Generate the QR codes first, then print.');
    return;
  }
  window.print();
});
clearBtn.addEventListener('click', () => {
  namesInput.value = '';
  grid.innerHTML = '';
  emptyMsg.style.display = 'block';
});
</script>
</body>
</html>
